<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>geai</title>
<style>
  :root{
    --bg:#1e1f22; --fg:#dfe1e5; --card:#2b2d30; --card-hover:#35373b;
    --border:#393b40; --accent:#589df6; --muted:#8c8c8c; --field:#2b2d30;
  }
  *{box-sizing:border-box}
  /* dark scrollbars (JCEF is Chromium) — kill the default white scroll */
  *{scrollbar-width:thin;scrollbar-color:var(--border) transparent}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border);border:2px solid transparent;border-radius:8px;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:content-box}
  ::-webkit-scrollbar-corner{background:transparent}
  ::-webkit-scrollbar-button{display:none;width:0;height:0}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;font-size:13px;line-height:1.5}
  #root{display:flex;flex-direction:column;height:100vh;overflow:hidden}

  /* top bar */
  #topbar{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--border);
    flex:0 0 auto}
  #topbar .brand{font-weight:600;letter-spacing:.2px;display:flex;align-items:center;gap:6px}
  .mark{color:var(--accent);display:inline-flex;align-items:center}
  .mark svg{display:block}
  #topbar .spacer{flex:1}
  #status{color:var(--muted);font-size:12px;margin-right:4px}
  .iconbtn{position:relative;background:none;border:none;color:var(--fg);cursor:pointer;border-radius:7px;
    padding:6px;opacity:.72;display:inline-flex;align-items:center;justify-content:center;transition:background .12s,opacity .12s}
  .iconbtn:hover{background:var(--card-hover);opacity:1}
  .iconbtn .ico{width:18px;height:18px;display:block;stroke:currentColor;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round;fill:none}
  /* custom hover tooltip (JCEF does not reliably show native title= tooltips) */
  .iconbtn::after{content:attr(data-tip);position:absolute;top:calc(100% + 7px);right:0;
    background:#0e0f11;color:var(--fg);border:1px solid var(--border);padding:4px 8px;border-radius:6px;
    font-size:11px;line-height:1.3;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s ease;
    box-shadow:0 6px 18px rgba(0,0,0,.45);z-index:60}
  .iconbtn:hover::after{opacity:1}

  /* scroll area */
  #scroll{flex:1;overflow-y:auto;padding:14px 14px 4px}

  /* welcome */
  #welcome .logo{font-size:26px;font-weight:700;display:flex;align-items:center;gap:8px;margin:8px 2px 2px}
  #welcome .logo .mark{color:var(--accent)}
  #welcome .tagline{color:var(--muted);margin:0 2px 16px;max-width:560px}
  .skill{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--border);
    border-radius:10px;background:var(--card);margin-bottom:8px;cursor:pointer;transition:background .12s,border-color .12s}
  .skill:hover{background:var(--card-hover);border-color:var(--accent)}
  .skill .ic{font-size:18px;width:22px;text-align:center}
  .skill .ttl{flex:1}
  .badge{font-size:10px;font-weight:700;letter-spacing:.4px;padding:2px 6px;border-radius:6px;
    border:1px solid var(--accent);color:var(--accent)}
  .badge.beta{border-color:#c071f0;color:#c071f0}

  /* chat */
  .msg{margin:0 0 14px}
  .msg .who{font-weight:600;margin-bottom:3px}
  .msg.user .who{color:var(--accent)}
  .msg.assistant .who{color:#4ec98b}
  .msg .body{white-space:normal;word-wrap:break-word}
  .msg .body p{margin:0 0 8px}
  .tool{color:var(--muted);font-size:12px;margin:0 0 6px;font-family:ui-monospace,Consolas,monospace;overflow-wrap:anywhere;word-break:break-word}
  .tool.err{color:#e06c75}
  .info{color:var(--muted);font-style:italic;margin:0 0 8px;overflow-wrap:anywhere}
  /* clickable source references (path:line) → open in the editor */
  .srcref{color:var(--accent);cursor:pointer;text-decoration:none;border-bottom:1px dashed transparent}
  .srcref:hover{border-bottom-color:var(--accent)}

  /* collapsible reasoning — hidden by default, toggled by the arrow */
  .reason{margin:0 0 12px;border:1px solid var(--border);border-radius:8px;background:var(--card);overflow:hidden}
  .reason>summary{cursor:pointer;list-style:none;padding:7px 10px;color:var(--muted);font-size:12px;
    display:flex;align-items:center;gap:6px;user-select:none}
  .reason>summary::-webkit-details-marker{display:none}
  .reason>summary::before{content:'▶';font-size:9px;transition:transform .12s}
  .reason[open]>summary::before{transform:rotate(90deg)}
  .reason>summary:hover{background:var(--card-hover)}
  .reason .rbody{padding:6px 12px 10px;color:var(--muted);white-space:pre-wrap;word-wrap:break-word;
    font-size:12px;border-top:1px solid var(--border);font-family:ui-monospace,Consolas,monospace}
  .errline{color:#e06c75;font-weight:600;margin:0 0 8px;white-space:pre-wrap}
  pre{background:#181a1c;border:1px solid var(--border);border-radius:8px;padding:9px 11px;overflow-x:auto;margin:6px 0}
  code{font-family:ui-monospace,Consolas,monospace;font-size:12px}
  p code{background:#181a1c;border:1px solid var(--border);border-radius:4px;padding:1px 4px}

  /* composer */
  #composer{position:relative;flex:0 0 auto;border-top:1px solid var(--border);padding:8px 10px}
  #cmdmenu{position:absolute;left:10px;right:10px;bottom:100%;margin-bottom:6px;background:var(--card);
    border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:20}
  .cmdrow{display:flex;gap:10px;align-items:baseline;padding:7px 11px;cursor:pointer}
  .cmdrow.active{background:var(--card-hover)}
  .cmdrow .cn{color:var(--accent);font-weight:600;font-family:ui-monospace,Consolas,monospace;flex-shrink:0}
  .cmdrow .cd{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #inputwrap{border:1px solid var(--border);border-radius:10px;background:var(--field);padding:8px 10px}
  #inputwrap:focus-within{border-color:var(--accent)}
  #input{width:100%;border:none;outline:none;resize:none;background:transparent;color:var(--fg);
    font-family:inherit;font-size:13px;min-height:60px;max-height:50vh;overflow-y:auto;line-height:1.45}
  #footer{display:flex;align-items:center;gap:10px;margin-top:6px}
  #tokens{color:var(--muted);font-size:12px}
  #send{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:6px 14px;cursor:pointer;font-weight:600}
  #send:hover{filter:brightness(1.08)}
  #send.stop{background:#5a5d63}
  .hidden{display:none!important}
  .iconbtn.active{color:var(--accent);background:var(--card-hover);opacity:1}
  /* context usage bar */
  #ctxbar{display:flex;align-items:center;gap:8px;margin-top:6px;padding:4px 0}
  #ctxbar .bar{flex:1;height:4px;border-radius:2px;background:var(--border);overflow:hidden;position:relative}
  #ctxbar .bar .fill{height:100%;border-radius:2px;transition:width .3s ease}
  #ctxbar .bar .fill.ok{background:#4ec98b}
  #ctxbar .bar .fill.warn{background:#d4a037}
  #ctxbar .bar .fill.danger{background:#e06c75}
  #ctxbar .pct{font-size:11px;color:var(--muted);min-width:36px;text-align:right}
  #ctxbar .cost{font-size:11px;color:var(--muted);margin-left:auto}
  .codeblock{position:relative}
  .codeblock .copybtn{position:absolute;top:6px;right:6px;font-size:11px;padding:2px 8px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--muted);cursor:pointer;opacity:0;transition:opacity .12s}
  .codeblock:hover .copybtn{opacity:.85}
  .codeblock .copybtn:hover{opacity:1;color:var(--fg);border-color:var(--accent)}
  .codeblock .copybtn.done{color:#4ec98b;border-color:#4ec98b;opacity:1}

  /* tool-group: collapsible block for all tool calls in one agent turn */
  .tools-group{margin:0 0 8px;border:1px solid var(--border);border-radius:8px;background:var(--card);font-size:12px;color:var(--muted)}
  .tools-group>summary{cursor:pointer;list-style:none;padding:5px 10px;display:flex;align-items:center;gap:6px;user-select:none}
  .tools-group>summary::-webkit-details-marker{display:none}
  .tools-group>summary::before{content:'⚙';font-size:10px;opacity:.7;margin-right:2px}
  .tools-group>summary:hover{background:var(--card-hover);border-radius:8px}
  .tools-group .tool-entries{padding:2px 10px 8px;display:flex;flex-direction:column;gap:3px;border-top:1px solid var(--border)}
  .tool-entry{display:flex;align-items:baseline;gap:6px;font-family:ui-monospace,Consolas,monospace;overflow:hidden}
  .tool-entry .tn{color:var(--accent);flex-shrink:0}
  .tool-entry .ta{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-size:11px}
  .tool-entry .ts{flex-shrink:0}
  .tool-entry .ts.ok{color:#4ec98b}
  .tool-entry .ts.err{color:#e06c75}
  .tool-result{font-family:ui-monospace,Consolas,monospace;font-size:11px;white-space:pre-wrap;word-break:break-word;margin:1px 0 5px 14px;opacity:.9}
  .tool-result.err{color:#e06c75}

  /* markdown extras inside assistant bubbles */
  .msg.assistant h1{font-size:1.2em;font-weight:700;margin:10px 0 4px;padding-bottom:3px;border-bottom:1px solid var(--border)}
  .msg.assistant h2{font-size:1.1em;font-weight:700;margin:10px 0 4px;padding-bottom:3px;border-bottom:1px solid var(--border)}
  .msg.assistant h3{font-size:1em;font-weight:700;margin:8px 0 3px}
  .msg.assistant h4{font-size:0.95em;font-weight:600;margin:6px 0 2px;color:var(--muted)}
  .msg.assistant h5{font-size:0.9em;font-weight:600;margin:4px 0 2px;color:var(--muted)}
  .msg.assistant h6{font-size:0.85em;font-weight:600;margin:4px 0 2px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
  .msg.assistant ul,.msg.assistant ol{padding-left:1.4em;margin:4px 0}
  .msg.assistant li{margin:1px 0}
  .msg.assistant table{border-collapse:collapse;margin:6px 0;font-size:0.92em;width:100%}
  .msg.assistant th,.msg.assistant td{border:1px solid var(--border);padding:3px 8px;text-align:left}
  .msg.assistant th{background:var(--card-hover);font-weight:600}

  /* history overlay */
  #overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
  #histbox{background:var(--card);border:1px solid var(--border);border-radius:12px;width:min(440px,86vw);
    max-height:70vh;overflow:auto;padding:10px}
  #histbox h3{margin:6px 8px 10px;font-size:14px}
  .histitem{position:relative;padding:9px 34px 9px 10px;border-radius:8px;cursor:pointer}
  .histitem:hover{background:var(--card-hover)}
  .histitem .t{font-weight:600}
  .histitem .m{color:var(--muted);font-size:12px}
  .histdel{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;
    color:var(--muted);cursor:pointer;opacity:0;font-size:13px;border-radius:6px;padding:3px 6px}
  .histitem:hover .histdel{opacity:.75}
  .histdel:hover{opacity:1;color:#e06c75;background:var(--bg)}
</style>
</head>
<body>
<div id="root">
  <div id="topbar">
    <span class="brand"><span class="mark"><svg viewBox="0 0 24 24" width="1.05em" height="1.05em" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/><path d="M12 2.5a9.5 9.5 0 0 1 8.2 5" opacity="0.6"/></svg></span>geai</span>
    <span class="spacer"></span>
    <span id="status">Ready</span>
    <button class="iconbtn" id="btnNew" aria-label="New session" data-tip="New session"><svg class="ico" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
    <button class="iconbtn" id="btnHistory" aria-label="History" data-tip="Session history"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 16 14"/></svg></button>
    <button class="iconbtn" id="btnSettings" aria-label="Settings" data-tip="Settings"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </div>

  <div id="scroll">
    <div id="welcome">
      <div class="logo"><span class="mark"><svg viewBox="0 0 24 24" width="1.05em" height="1.05em" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/><path d="M12 2.5a9.5 9.5 0 0 1 8.2 5" opacity="0.6"/></svg></span> geai</div>
      <p class="tagline">Your assistant for debugging, navigation, and edits. It understands the
        project structure, sets breakpoints, drives the debugger, and matches your code style.</p>
      <div id="skills"></div>
    </div>
    <div id="chat" class="hidden"></div>
  </div>

  <div id="composer">
    <div id="cmdmenu" class="hidden"></div>
    <div id="inputwrap">
      <textarea id="input" placeholder="Describe the bug, e.g. “invalid data reaches the UI, I can’t find where we lose it”. Enter to send, Shift+Enter for a new line. Type / for commands."></textarea>
    </div>
    <div id="ctxbar"><div class="bar"><div class="fill ok" id="ctxfill" style="width:0%"></div></div><span class="pct" id="ctxpct"></span><span class="cost" id="ctxcost"></span></div>
    <div id="footer">
      <span id="tokens"></span>
      <button id="send">Send</button>
    </div>
  </div>
</div>

<script>
(function(){
  var running=false, started=false;
  var el=function(id){return document.getElementById(id)};
  var scroll=el('scroll'), chat=el('chat'), welcome=el('welcome'), input=el('input'),
      send=el('send'), statusEl=el('status'), tokensEl=el('tokens'), cmdMenu=el('cmdmenu');
  // slash-command discoverability ("/" menu): catalog from Kotlin, current matches, highlighted row
  var cmds=[], cmdMatches=[], cmdActive=-1;
  // tool-group state (reset each agent turn)
  var tGroup=null, tEntries=null, tCount=0, tPending={};
  // streaming: the live assistant bubble body + accumulated raw text, and the live reasoning block body
  var streamBody=null, streamRaw='', reasonBody=null;

  function send2k(obj){ if(window.geaiSend) window.geaiSend(JSON.stringify(obj)); }

  function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function b64(s){ try{ return btoa(unescape(encodeURIComponent(s))); }catch(e){ return ''; } }
  function unb64(s){ try{ return decodeURIComponent(escape(atob(s))); }catch(e){ return ''; } }
  // turn `path.ext[:line]` references into clickable links that open the file in the editor
  function linkify(html){
    return html.replace(/((?:[\w.$-]+[\/\\])*[\w.$-]+\.(?:java|kt|kts|xml|py|js|jsx|ts|tsx|json|ya?ml|gradle|properties|sql|html|css|cpp|hpp|go|rs|rb|php|cs|swift|scala|groovy))(?::(\d+))?(?::\d+)?/g, function(m, path, ln){
      return '<a class="srcref" data-path="'+path.replace(/"/g,'&quot;')+'"'+(ln?(' data-line="'+ln+'"'):'')+'>'+m+'</a>';
    });
  }
  function inlineMd(s){
    return linkify(esc(s)
      .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
      .replace(/`([^`]+)`/g,'<code>$1</code>'));
  }
  function renderTable(rows){
    var data=rows.filter(function(l){return !/^\s*\|[\s\-|:]+\|\s*$/.test(l);});
    if(!data.length) return '';
    function parseRow(l){return l.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(function(c){return c.trim();});}
    var head=parseRow(data[0]).map(function(c){return '<th>'+inlineMd(c)+'</th>';}).join('');
    var body=data.slice(1).map(function(r){return '<tr>'+parseRow(r).map(function(c){return '<td>'+inlineMd(c)+'</td>';}).join('')+'</tr>';}).join('');
    return '<table><thead><tr>'+head+'</tr></thead>'+(body?'<tbody>'+body+'</tbody>':'')+'</table>';
  }
  // markdown: fenced code, tables, headings, lists, bold, inline-code, paragraphs
  function md(text){
    var FENCE='\x00', blocks=[], out=[];
    // 1. extract fenced code blocks
    text=(text||'').replace(/```[\s\S]*?```/g,function(m){
      var seg=m.slice(3,-3).replace(/^[a-zA-Z0-9_+-]*\n?/,'');
      blocks.push('<div class="codeblock"><button class="copybtn" data-code="'+b64(seg)+'">Copy</button><pre><code>'+esc(seg)+'</code></pre></div>');
      return FENCE+(blocks.length-1)+FENCE;
    });
    var lines=text.split('\n'), i=0, para=[];
    function flushPara(){if(para.length){out.push('<p>'+para.join('<br>')+'</p>');para=[];}}
    while(i<lines.length){
      var l=lines[i];
      // fenced code placeholder
      var fm=l.trim().match(/^\x00(\d+)\x00$/);
      if(fm){flushPara();out.push(blocks[+fm[1]]);i++;continue;}
      // table
      if(/^\s*\|/.test(l)){
        flushPara();
        var tbl=[];
        while(i<lines.length&&/^\s*\|/.test(lines[i])){tbl.push(lines[i]);i++;}
        out.push(renderTable(tbl));continue;
      }
      // h1–h6
      var h=l.match(/^(#{1,6})\s+(.+)/);if(h){flushPara();var lv=h[1].length;out.push('<h'+lv+'>'+inlineMd(h[2])+'</h'+lv+'>');i++;continue;}
      // unordered list
      if(/^[-*]\s+/.test(l)){
        flushPara();var items=[];
        while(i<lines.length&&/^[-*]\s+/.test(lines[i])){items.push('<li>'+inlineMd(lines[i].replace(/^[-*]\s+/,''))+'</li>');i++;}
        out.push('<ul>'+items.join('')+'</ul>');continue;
      }
      // ordered list
      if(/^\d+\.\s+/.test(l)){
        flushPara();var items=[];
        while(i<lines.length&&/^\d+\.\s+/.test(lines[i])){items.push('<li>'+inlineMd(lines[i].replace(/^\d+\.\s+/,''))+'</li>');i++;}
        out.push('<ol>'+items.join('')+'</ol>');continue;
      }
      // blank line → paragraph break
      if(l.trim()===''){flushPara();i++;continue;}
      // normal text
      para.push(inlineMd(l));i++;
    }
    flushPara();
    return out.join('');
  }

  function showChat(){ if(!started){started=true; welcome.classList.add('hidden'); chat.classList.remove('hidden');} }
  function atBottom(){ return scroll.scrollHeight-scroll.scrollTop-scroll.clientHeight < 60; }
  function append(node){ var stick=atBottom(); chat.appendChild(node); if(stick) scroll.scrollTop=scroll.scrollHeight; }

  function bubble(cls,who,text){ var d=document.createElement('div'); d.className='msg '+cls;
    d.innerHTML='<div class="who">'+esc(who)+'</div><div class="body">'+md(text)+'</div>'; append(d); }
  function line(cls,text){ var d=document.createElement('div'); d.className=cls; d.innerHTML=linkify(esc(text)); append(d); }
  function reasoning(text){ var d=document.createElement('details'); d.className='reason';
    d.innerHTML='<summary>Reasoning</summary><div class="rbody"></div>';
    d.querySelector('.rbody').textContent=text; append(d); }

  // ---- streaming: append deltas to ONE bubble, then re-render as markdown on completion ----
  function streamDelta(text){
    if(!streamBody){
      closeToolGroup(stepsLabel(tCount,'✓')); tCount=0; tPending={};
      var d=document.createElement('div'); d.className='msg assistant';
      d.innerHTML='<div class="who">geai</div><div class="body"></div>';
      streamBody=d.querySelector('.body'); streamRaw=''; append(d);
    }
    streamRaw+=text; streamBody.textContent=streamRaw;
    if(atBottom()) scroll.scrollTop=scroll.scrollHeight;
  }
  function reasonDelta(text){
    if(!reasonBody){
      var d=document.createElement('details'); d.className='reason';
      d.innerHTML='<summary>Reasoning</summary><div class="rbody"></div>';
      reasonBody=d.querySelector('.rbody'); append(d);
    }
    reasonBody.textContent=(reasonBody.textContent||'')+text;
    if(atBottom()) scroll.scrollTop=scroll.scrollHeight;
  }
  // Finalize the live bubble: re-render the streamed text as markdown. Returns true if it consumed a
  // streaming bubble, so the caller skips creating a fresh one. Also closes any open reasoning stream.
  function finalizeStream(full){
    reasonBody=null;
    if(!streamBody) return false;
    streamBody.innerHTML=md((full&&full.length)?full:streamRaw);
    streamBody=null; streamRaw='';
    if(atBottom()) scroll.scrollTop=scroll.scrollHeight;
    return true;
  }

  function setRunning(r){ running=r; send.textContent=r?'Stop':'Send'; send.classList.toggle('stop',r);
    input.disabled=r; statusEl.textContent=r?'Working…':'Ready'; }
  function closeToolGroup(label){
    if(!tGroup) return;
    var s=tGroup.querySelector('summary'); if(s) s.textContent=label;
    tGroup.removeAttribute('open');
    tGroup=null; tEntries=null;
  }
  function stepsLabel(n,suffix){ return n+' step'+(n===1?'':'s')+' '+suffix; }

  function renderEvent(ev){
    switch(ev.type){
      case 'userMessage':
        showChat(); finalizeStream();
        closeToolGroup(stepsLabel(tCount,'✓')); tCount=0; tPending={};
        bubble('user','You',ev.text); break;
      case 'thinking': statusEl.textContent='Thinking…'; break;
      case 'reasoning': showChat(); reasoning(ev.text); break;
      case 'reasoningDelta': showChat(); reasonDelta(ev.text); break;
      case 'assistantTextDelta': showChat(); streamDelta(ev.text); break;
      case 'assistantText':
        showChat();
        if(!finalizeStream(ev.text)){
          closeToolGroup(stepsLabel(tCount,'✓')); tCount=0; tPending={};
          bubble('assistant','geai',ev.text);
        }
        break;
      case 'toolStarted': {
        showChat(); finalizeStream();
        if(!tGroup){
          tGroup=document.createElement('details');
          tGroup.className='tools-group'; tGroup.setAttribute('open','');
          var sum=document.createElement('summary'); sum.textContent='1 step…';
          tGroup.appendChild(sum);
          tEntries=document.createElement('div'); tEntries.className='tool-entries';
          tGroup.appendChild(tEntries);
          append(tGroup); tCount=0;
        }
        tCount++;
        tGroup.querySelector('summary').textContent=stepsLabel(tCount,'…');
        var entry=document.createElement('div'); entry.className='tool-entry';
        var preview=esc((ev.args||'').replace(/\s+/g,' ').slice(0,100));
        entry.innerHTML='<span class="tn">'+esc(ev.tool)+'</span><span class="ta">'+preview+'</span><span class="ts">⏳</span>';
        tEntries.appendChild(entry);
        tPending[ev.id||ev.tool]=entry;
        if(atBottom()) scroll.scrollTop=scroll.scrollHeight;
        break;
      }
      case 'toolFinished': {
        var key=ev.id||ev.tool, ent=tPending[key];
        if(ent){
          var ts=ent.querySelector('.ts');
          ts.textContent=ev.error?'✗':'✓';
          ts.className='ts '+(ev.error?'err':'ok');
          // Surface WHY a tool failed (the reason already crosses the bridge) instead of a bare ✗.
          if(ev.error&&ev.content){
            var sub=document.createElement('div'); sub.className='tool-result err';
            sub.textContent=ev.content.replace(/\s+/g,' ').trim().slice(0,300);
            if(ent.parentNode) ent.parentNode.insertBefore(sub, ent.nextSibling);
          }
          delete tPending[key];
        }
        if(atBottom()) scroll.scrollTop=scroll.scrollHeight;
        break;
      }
      case 'info': showChat(); line('info',ev.text); break;
      case 'error':
        showChat(); finalizeStream();
        closeToolGroup(stepsLabel(tCount,'✗')); tCount=0; tPending={};
        var e=document.createElement('div'); e.className='errline'; e.textContent='⚠ '+ev.text; append(e);
        setRunning(false); break;
      case 'cancelled':
        showChat(); finalizeStream();
        closeToolGroup(stepsLabel(tCount,'✗')); tCount=0; tPending={};
        line('info',ev.text||'Stopped.'); setRunning(false); break;
      case 'done':
        finalizeStream();
        closeToolGroup(stepsLabel(tCount,'✓')); tCount=0; tPending={};
        statusEl.textContent='Done';
        if(ev.tokensIn!=null) setTokens(ev.tokensIn,ev.tokensOut);
        setRunning(false); break;
    }
  }
  function oneLine(s){ s=(s||'').replace(/\s+/g,' ').trim(); return s.length>180?s.slice(0,180)+'…':s; }
  function setTokens(i,o){ tokensEl.textContent='↑'+fmt(i)+' ↓'+fmt(o); }
  function fmt(n){ n=n||0; return n>=1000?(n/1000).toFixed(1)+'k':(''+n); }
  function setUsage(u){
    if(!u){ return; }
    var ctx=u.contextTokens||0, win=u.contextWindow||0;
    var pct=win>0?Math.round(100*ctx/win):0;
    var fill=el('ctxfill'), pctEl=el('ctxpct'), costEl=el('ctxcost');
    if(fill){ fill.style.width=pct+'%'; fill.className='fill '+(pct>=80?'danger':pct>=60?'warn':'ok'); }
    if(pctEl){ pctEl.textContent=win?pct+'%':''; }
    var cs='';
    if(u.costUsd!=null) cs='~$'+u.costUsd.toFixed(4);
    else if((u.tokensIn||0)+(u.tokensOut||0)>0) cs='↑'+fmt(u.tokensIn)+' ↓'+fmt(u.tokensOut);
    if(costEl) costEl.textContent=cs;
    tokensEl.textContent='context '+fmt(ctx)+(win?' / '+fmt(win):'');
  }

  function renderSkills(skills){
    var host=el('skills'); host.innerHTML='';
    (skills||[]).forEach(function(sk){
      var d=document.createElement('div'); d.className='skill';
      d.innerHTML='<span class="ic">'+esc(sk.icon)+'</span><span class="ttl">'+esc(sk.title)+'</span>'+
        (sk.badge?'<span class="badge '+(sk.badge.toLowerCase()==='beta'?'beta':'')+'">'+esc(sk.badge)+'</span>':'');
      d.onclick=function(){ input.value=sk.prompt; input.focus();
        input.setSelectionRange(input.value.length,input.value.length); };
      host.appendChild(d);
    });
  }

  function autoGrow(){ input.style.height='auto'; input.style.height=Math.min(input.scrollHeight, Math.floor(window.innerHeight*0.5))+'px'; }
  function submit(){ if(running) { send2k({action:'stop'}); return; }
    var t=input.value.trim(); if(!t) return; input.value=''; hideCmdMenu(); autoGrow(); setRunning(true); send2k({action:'submit',text:t}); }

  // ---- slash-command menu ----
  function hideCmdMenu(){ cmdMenu.classList.add('hidden'); cmdMenu.innerHTML=''; cmdActive=-1; cmdMatches=[]; }
  function setCmdActive(i){ cmdActive=i; var rows=cmdMenu.children;
    for(var k=0;k<rows.length;k++) rows[k].classList.toggle('active',k===i); }
  function moveCmd(d){ if(cmdMatches.length) setCmdActive(((cmdActive<0?0:cmdActive)+d+cmdMatches.length)%cmdMatches.length); }
  function acceptCmd(name){ input.value='/'+name+' '; hideCmdMenu(); autoGrow(); input.focus();
    input.setSelectionRange(input.value.length,input.value.length); }
  function refreshCmdMenu(){
    var m=input.value.match(/^\/([a-zA-Z]*)$/);
    if(!m||!cmds.length){ hideCmdMenu(); return; }
    var q=m[1].toLowerCase();
    cmdMatches=cmds.filter(function(c){ return c.name.toLowerCase().indexOf(q)===0; });
    if(!cmdMatches.length){ hideCmdMenu(); return; }
    cmdMenu.innerHTML=cmdMatches.map(function(c){
      return '<div class="cmdrow" data-cmd="'+esc(c.name)+'"><span class="cn">/'+esc(c.name)+'</span><span class="cd">'+esc(c.desc)+'</span></div>'; }).join('');
    setCmdActive(0); cmdMenu.classList.remove('hidden');
  }
  cmdMenu.addEventListener('click',function(e){ var r=e.target.closest?e.target.closest('.cmdrow'):null; if(r) acceptCmd(r.getAttribute('data-cmd')); });

  send.onclick=submit;
  input.addEventListener('input', function(){ autoGrow(); refreshCmdMenu(); });
  input.addEventListener('keydown',function(e){
    if(!cmdMenu.classList.contains('hidden')){
      if(e.key==='ArrowDown'){ e.preventDefault(); moveCmd(1); return; }
      if(e.key==='ArrowUp'){ e.preventDefault(); moveCmd(-1); return; }
      if(e.key==='Escape'){ e.preventDefault(); hideCmdMenu(); return; }
      if(e.key==='Tab'||(e.key==='Enter'&&!e.shiftKey)){ e.preventDefault();
        var sel=cmdMatches[cmdActive<0?0:cmdActive]; if(sel){ acceptCmd(sel.name); return; } }
    }
    if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); submit(); }
  });
  el('btnNew').onclick=function(){ send2k({action:'newSession'}); };
  el('btnSettings').onclick=function(){ send2k({action:'openSettings'}); };
  el('btnHistory').onclick=function(){ send2k({action:'history'}); };

  chat.addEventListener('click', function(e){
    var ref = e.target.closest ? e.target.closest('.srcref') : null;
    if(ref){ e.preventDefault();
      var ln = parseInt(ref.getAttribute('data-line')||'',10);
      send2k({action:'openFile', path:ref.getAttribute('data-path'), line:isNaN(ln)?null:ln});
      return; }
    var btn = e.target.closest ? e.target.closest('.copybtn') : null; if(!btn) return;
    var code = unb64(btn.getAttribute('data-code')||''); if(!code) return;
    send2k({action:'copy', text: code});
    var prev = btn.textContent; btn.textContent='✓ Copied'; btn.classList.add('done');
    setTimeout(function(){ btn.textContent=prev; btn.classList.remove('done'); }, 1200);
  });

  // ---- Kotlin -> JS API ----
  window.geaiBoot=function(){ send2k({action:'ready'}); };
  window.geaiInit=function(state){
    if(state.theme){ var r=document.documentElement.style;
      for(var k in state.theme){ r.setProperty('--'+k, state.theme[k]); } }
    if(state.engine) tokensEl.title=state.engine;
    renderSkills(state.skills);
    cmds = state.commands || [];
    chat.innerHTML=''; streamBody=null; streamRaw=''; reasonBody=null; started=false; welcome.classList.remove('hidden'); chat.classList.add('hidden');
    if(state.transcript && state.transcript.length){ state.transcript.forEach(renderEvent); }
    if(state.usage) setUsage(state.usage); else setTokens(state.tokensIn||0, state.tokensOut||0);
    setRunning(!!state.running);
    if(state.configured===false){ showChat(); line('info','Geai isn’t configured yet. Open Settings | Tools | Geai and add an API key, or enable the Claude Code engine.'); }
  };
  window.geaiEvent=function(ev){ renderEvent(ev); };
  window.geaiUsage=function(u){ setUsage(u); };
  window.geaiReset=function(){ chat.innerHTML=''; streamBody=null; streamRaw=''; reasonBody=null; started=false; welcome.classList.remove('hidden');
    chat.classList.add('hidden'); statusEl.textContent='New session'; setRunning(false); };
  function fmtDate(ts){ try{ var d=new Date(ts);
    return d.toLocaleDateString()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }catch(e){ return ''; } }
  window.geaiHistory=function(list){
    var prev=el('overlay'); if(prev) prev.remove(); // replace, never stack (delete re-sends the list)
    var ov=document.createElement('div'); ov.id='overlay';
    var box=document.createElement('div'); box.id='histbox'; box.innerHTML='<h3>Session history</h3>';
    if(!list||!list.length){ box.innerHTML+='<div class="info" style="padding:8px">No saved sessions yet.</div>'; }
    (list||[]).forEach(function(s){
      var it=document.createElement('div'); it.className='histitem';
      var when=s.updatedAt?' · '+fmtDate(s.updatedAt):'';
      it.innerHTML='<div class="t">'+esc(s.title)+'</div><div class="m">'+s.messageCount+' messages'+when+'</div>';
      var del=document.createElement('button'); del.className='histdel'; del.textContent='🗑'; del.title='Delete session';
      del.onclick=function(e){ e.stopPropagation(); send2k({action:'deleteSession',id:s.id}); };
      it.appendChild(del);
      it.onclick=function(){ ov.remove(); send2k({action:'loadSession',id:s.id}); };
      box.appendChild(it);
    });
    ov.appendChild(box); ov.onclick=function(e){ if(e.target===ov) ov.remove(); };
    document.body.appendChild(ov);
  };

  if(window.geaiSend) window.geaiBoot();
})();
</script>
</body>
