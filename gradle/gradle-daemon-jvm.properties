#  Pins the Gradle daemon (and therefore the Kotlin compiler daemon) to JDK 21.
#  IntelliJ IDEA 2025.2 targets Java 21, and Kotlin 2.1.0 cannot run on JDK 25+
#  (it fails to parse the "25.x" version string). Gradle selects/auto-provisions a
#  matching JDK 21 from detected installations, so no absolute paths are committed.
toolchainVersion=21
