name: CI

# Build & test every push/PR. On a push to main where gradle.properties has a NEW version,
# auto-create a GitHub Release with the plugin zip and repoint updatePlugins.xml at it — so a
# custom plugin repository (raw updatePlugins.xml) auto-updates installed copies.

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build & test
        run: ./gradlew buildPlugin test
      - uses: actions/upload-artifact@v4
        with:
          name: geai-plugin-zip
          path: build/distributions/*.zip

  release:
    name: Release on version bump
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: ver
        run: echo "v=$(grep '^version' gradle.properties | head -1 | cut -d'=' -f2 | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Does the release already exist?
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.ver.outputs.v }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build plugin
        if: steps.rel.outputs.exists == 'false'
        run: ./gradlew buildPlugin

      - name: Compose release notes
        if: steps.rel.outputs.exists == 'false'
        run: |
          mkdir -p build/tmp
          ./gradlew getChangelog --quiet --no-header --console=plain --output-file=build/tmp/notes.txt || true
          test -s build/tmp/notes.txt || echo "geai v${{ steps.ver.outputs.v }}" > build/tmp/notes.txt

      - name: Create release
        if: steps.rel.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.ver.outputs.v }}"
          gh release create "v$VER" "build/distributions/geai-$VER.zip" \
            --title "geai $VER" --notes-file build/tmp/notes.txt

      - name: Repoint updatePlugins.xml and commit
        if: steps.rel.outputs.exists == 'false'
        run: |
          VER="${{ steps.ver.outputs.v }}"
          URL="https://github.com/${{ github.repository }}/releases/download/v$VER/geai-$VER.zip"
          sed -i -E "s#(url=\")[^\"]*#\1$URL#" updatePlugins.xml
          # anchor on the trailing "> so only the <plugin> version is touched, never the XML prolog
          sed -i -E "s#version=\"[^\"]*\">#version=\"$VER\">#" updatePlugins.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updatePlugins.xml
          git commit -m "chore: release v$VER — update plugin repository descriptor [skip ci]" || echo "nothing to commit"
          git push
